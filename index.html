<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>Charting Terminal</title><link rel="stylesheet" href="style.css?v=10"></head><body><main><section id="watch" class="page active"><header><div><h1>Watchlist</h1><small>Live market data</small></div><button id="theme" aria-label="Toggle day night">☾</button></header><div class="data-source"><b>Twelve Data</b><small>Enter your API key locally — it is saved only in this browser.</small><div class="key-row"><input id="td-key" type="password" placeholder="Twelve Data API key"><button id="save-key">Save</button><button id="clear-key">Clear</button></div><small id="key-status"></small></div><div id="watchlist"></div></section><section id="charts" class="page"><header class="chart-header"><div class="symbol-box"><strong id="symbol">BTC/USD</strong><span id="price">—</span></div><div class="layouts"><button data-layout="1">1 Screen</button><button data-layout="2">2 Screen</button><button data-layout="4">4 Screen</button><button id="back">Watchlist</button><button id="chart-theme" aria-label="Toggle day night">☾</button></div></header><div id="grid" class="grid"></div><div id="indicator-panel" class="panel"><b>Indicators</b><button data-ind="EMA">EMA 20</button><button data-ind="RSI">RSI 14</button><button data-ind="MACD">MACD</button><button data-ind="CLEAR">Clear</button></div><div id="toolbox" class="panel"><b>Tools</b><button data-tool="crosshair">Crosshair</button><button data-tool="horizontal">Horizontal line</button><button data-tool="trend">Trend line</button><button data-tool="clear-tools">Clear tools</button></div><nav><button data-tf="1m">1m</button><button data-tf="5m">5m</button><button data-tf="15m">15m</button><button data-tf="1h">1h</button><button id="ind">Indicators</button><button id="tools">Tools</button></nav></section></main><script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script><script src="app.js?v=14"></script></body></html>
